<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Yamaha | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="sass/styles.css">
    <link rel="stylesheet" href="jquery-ui-1.13.0.custom/jquery-ui.min.css">
    <link rel="stylesheet" href="font-awesome/css/font-awesome.min.css">
</head>
<body>
    <div class="container" id="register_container">        
          
    </div>

    <div id="myModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Information</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger yesno" data-bs-dismiss="modal" id="no">No</button>
              <button type="button" class="btn btn-primary yesno" id="yes">Yes</button>
            </div>
          </div>
        </div>
      </div>

      <div id="loginModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Register Login</h5>              
            </div>
            <div class="modal-body">
                <div class="row">
                    <input type="text" id="username" class="login-field" placeholder="User Name">
                </div>
                <div class="row">
                    <input type="password" id="password" class="login-field" placeholder="Password">
                </div>
                <div class="row">
                    <button class="btn btn-primary login-btn">Login</button>
                </div>
            </div>
          </div>
        </div>
      </div>

      <div id="passwordModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Change Password</h5>  
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>            
            </div>
               <div class="modal-body">
                    <div class="row">
                        <input type="password" id="change_password" class="login-field" placeholder="Password">
                    </div>
                    <div class="row">
                        <input type="password" id="check_password" class="login-field" placeholder="Password again">
                    </div>
                    <div class="row">
                         <button class="btn btn-primary password-btn">Submit</button>
                    </div>
                    <div class="row">
                        <div class="modal-message"></div>
                   </div>
                </div>
            </div>
          </div>
        </div>

      <div id="printModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Print Report</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="print-body"></div>
          </div>
        </div>
      </div>

    <div class="report-container" id="report_container">
        <div class="report-header">
            <span class="fa fa-print fa-2x float-left black print-report"></span>
            <h1 class="print-report-heading">Register Report</h1>
            <span class="fa fa-times fa-2x float-right red close-report"></span>
        </div>
        <div class="report-body" id="report_body"></div>
    </div>

    <input type="hidden" id="status" value="">
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="jquery-ui-1.13.0.custom/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
